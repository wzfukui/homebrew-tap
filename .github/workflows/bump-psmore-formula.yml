name: Bump psmore Formula

on:
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update psmore formula
        id: bump
        run: ./.github/scripts/bump-psmore-formula.sh

      - name: Create pull request
        if: steps.bump.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: bump psmore formula to ${{ steps.bump.outputs.version }}"
          committer: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          author: github-actions[bot] <github-actions[bot]@users.noreply.github.com>
          title: "chore: bump psmore formula to ${{ steps.bump.outputs.version }}"
          body: |
            Automated update from latest psmore release.
            Version: ${{ steps.bump.outputs.version }}
          branch: "chore/bump-psmore-${{ steps.bump.outputs.version }}"
          labels: |
            automation
            dependencies
          delete-branch: true
          add-paths: |
            Formula/psmore.rb
